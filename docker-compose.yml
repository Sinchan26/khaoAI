services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: khaoai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - khaoai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d khaoai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  khaoai_postgres:
