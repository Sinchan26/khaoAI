<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>khaoAI — Smart Food Concierge</title>
  <meta name="description" content="AI-powered food concierge that finds the cheapest, highest-rated, fastest delivery options across Tomato and Twiggy." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════ AUTH PAGE ═══════════ -->
  <div id="auth-page" class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🍽️</div>
        <h1 id="auth-title">Sign in to khaoAI</h1>
        <p class="auth-subtitle">Your smart food concierge</p>
      </div>
      <form id="auth-form" class="auth-form" autocomplete="on">
        <div id="auth-name-wrap" class="auth-input-wrap" style="display:none;">
          <input id="auth-name" type="text" placeholder="Display Name" autocomplete="name" />
        </div>
        <div class="auth-input-wrap">
          <input id="auth-email" type="email" placeholder="Email" autocomplete="email" required />
        </div>
        <div class="auth-input-wrap">
          <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" required />
        </div>
        <p id="auth-error" class="auth-error"></p>
        <button id="auth-submit" type="submit" class="btn-primary">Sign In</button>
        <p class="auth-toggle">
          <span id="auth-toggle-text">Don't have an account?</span>
          <a id="auth-toggle-link" href="#">Register</a>
        </p>
      </form>
    </div>
  </div>

  <!-- ═══════════ MAIN APP ═══════════ -->
  <div id="app-page" class="app-page" style="display:none;">

    <!-- Top Bar -->
    <header id="top-bar" class="top-bar">
      <div class="top-bar-left">
        <span class="logo-emoji">🍽️</span>
        <span class="logo-text">khaoAI</span>
      </div>
      <div class="top-bar-right">
        <button id="btn-new-chat" class="btn-icon" title="New Chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button id="btn-settings" class="btn-icon" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="btn-logout" class="btn-icon" title="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <!-- Chat Area -->
    <main id="chat-area" class="chat-area">
      <!-- Welcome screen (shown when no messages) -->
      <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-icon">🍽️</div>
        <h2>What are you craving?</h2>
        <p>I'll find the cheapest, highest-rated, and fastest options across <strong>Tomato 🍅</strong> and <strong>Twiggy 🌿</strong></p>
        <div class="quick-chips">
          <button class="chip" data-prompt="What should I eat now?">🤔 What should I eat?</button>
          <button class="chip" data-prompt="I want some biryani for dinner">🍗 Biryani for dinner</button>
          <button class="chip" data-prompt="Suggest me something veg under 200">🥗 Veg under ₹200</button>
          <button class="chip" data-prompt="Best rated momos near Salt Lake">🥟 Best momos nearby</button>
          <button class="chip" data-prompt="I'm craving South Indian breakfast">🥞 South Indian breakfast</button>
          <button class="chip" data-prompt="Cheapest pizza delivery right now">🍕 Cheapest pizza</button>
        </div>
      </div>

      <!-- Messages container -->
      <div id="messages" class="messages"></div>
    </main>

    <!-- Input Bar -->
    <footer class="input-bar">
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Ask me anything about food..." autocomplete="off" />
        <button id="chat-send" type="submit" class="btn-send" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </form>
    </footer>
  </div>

  <!-- ═══════════ SETTINGS MODAL ═══════════ -->
  <div id="settings-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Settings</h3>
        <button id="settings-close" class="btn-icon">✕</button>
      </div>
      <div class="modal-body">
        <label>Default Location
          <input id="set-location" type="text" value="Salt Lake, Sector V" />
        </label>
        <label>Dietary Preference
          <select id="set-diet">
            <option value="all">All</option>
            <option value="veg">Vegetarian</option>
            <option value="non-veg">Non-Veg Only</option>
          </select>
        </label>
        <label>Budget
          <select id="set-budget">
            <option value="budget">Budget (under ₹150)</option>
            <option value="medium" selected>Medium (₹150–350)</option>
            <option value="premium">Premium (₹350+)</option>
          </select>
        </label>
        <label>Max Delivery Time
          <select id="set-delivery">
            <option value="20">20 mins</option>
            <option value="30">30 mins</option>
            <option value="45" selected>45 mins</option>
            <option value="60">60 mins</option>
          </select>
        </label>
        <button id="settings-save" class="btn-primary" style="margin-top:1rem;">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
